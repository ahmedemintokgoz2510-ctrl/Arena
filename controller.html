<!DOCTYPE html>
<!-- controller.html = TELEFON KUMANDASI (oyuncu telefonu YATAY tutar). QR kod bu sayfayi acar. Mantik: controller.js -->
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Sınıf Arenası - Kontrolcü</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="ctrl">
  <p class="rotate">Telefonu yatay çevir.</p>
  <main class="pad" id="joinView">
    <section class="card">
      <h1 class="ctitle">SINIF ARENASI</h1>
      <h2>Oyuncu Adı</h2>
      <input class="input" id="nameInput" type="text" maxlength="16" placeholder="Adını gir..." value="" autocomplete="off" autocapitalize="words">
      <p class="err" id="err"></p>
      <button class="btn" id="joinBtn">OYUNA KATIL</button>
      <p class="conn" id="connJoin">● BAĞLANIYOR...</p>
    </section>
  </main>
  <section class="play hidden" id="connectedView">
    <header class="hud">
      <div class="hud-left"><div class="pname"><i class="cdot" id="colorDot"></i><span id="playerName"></span></div><div class="hud-mid" id="hudMid">● BAĞLI</div></div>
      <div class="hearts" id="hearts" aria-label="Canlar">❤️❤️❤️</div>
      <div class="score" id="score">PUAN: 0</div>
    </header>
    <div class="main">
      <div class="stick-zone" id="stickZone"><div class="stick" id="stick"><div class="knob" id="knob"></div></div></div>
      <div class="side">
        <canvas class="minimap" id="miniMap" aria-label="Mini harita"></canvas>
        <div class="row2">
          <div class="zonebox idle" id="zoneBox"><small>SEÇİLİ BÖLGE</small><b id="zoneLetter"></b></div>
          <div class="count" id="count"></div>
        </div>
        <div class="msg" id="msg"></div>
      </div>
    </div>
  </section>
  <script src="/socket.io/socket.io.js"></script>
  <script src="controller.js"></script>
</body>
</html>
