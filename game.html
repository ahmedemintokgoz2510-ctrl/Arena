<!DOCTYPE html>
<!-- game.html = OYUN EKRANI (tahta / bilgisayar, 16:9): ders secimi -> lobi -> 2.5D arena. Mantik: game.js, tasarim: style.css -->
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sınıf Arenası</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="board-page">
  <div class="board">
    <div class="stage">
      <div class="status bad" id="status">● BAĞLANTI BEKLENİYOR</div>

      <!-- 1) DERS SECIMI -->
      <section class="screen setup hidden" id="setup">
        <div class="logo">SINIF ARENASI</div>
        <div class="lead">DERSİNİ SEÇ</div>
        <div class="cards" id="cards"></div>
        <button class="btn go" id="openLobby" disabled>LOBİYİ AÇ</button>
      </section>

      <!-- 2) LOBI -->
      <section class="screen lobby hidden" id="lobby">
        <div class="card lobby-left">
          <div class="logo small">SINIF ARENASI</div>
          <div class="subj" id="lobbySubject"></div>
          <button class="link" id="changeSubject">DERSİ DEĞİŞTİR</button>
          <h2 id="lobbyCount">OYUNCULAR 0/20</h2>
          <ul class="plist" id="plist"></ul>
        </div>
        <div class="card lobby-right">
          <div class="join-title">TELEFONUNLA QR KODU OKUT</div>
          <div class="qr-box" id="qrBox" aria-label="Katılım QR kodu"></div>
          <div class="join-sub">Sonra ismini girerek oyuna katıl.</div>
          <div class="join-url" id="joinUrl"></div>
          <button class="btn go" id="startBtn" disabled>OYUNCU BEKLENİYOR...</button>
        </div>
      </section>

      <!-- 3) OYUN: soru HUD + 2.5D arena -->
      <section class="screen game hidden" id="game">
        <header class="strip">
          <span class="title">SINIF ARENASI</span>
          <span class="counter" id="counter">OYUNCULAR: 0/20</span>
        </header>
        <div class="qhud">
          <div class="qmeta" id="qmeta"></div>
          <div class="qtext" id="qtext"></div>
          <div class="timer" id="timer"></div>
        </div>
        <div class="arena">
          <div class="plane" id="plane">
            <!-- Zemin perspektifle yatirilir; A/B/C/D bolgeleri zemine boyanmistir -->
            <div class="floor" id="floor">
              <div class="zone a"><b>A</b><span></span></div>
              <div class="zone b"><b>B</b><span></span></div>
              <div class="zone c"><b>C</b><span></span></div>
              <div class="zone d"><b>D</b><span></span></div>
            </div>
            <div class="chars" id="world"></div>
          </div>
        </div>
      </section>
    </div>
  </div>
  <div class="overlay hidden" id="winnerBox">
    <div class="win-card">
      <div class="win-title">🏆 KAZANAN</div>
      <div class="win-name" id="winName"></div>
      <div class="win-score" id="winScore"></div>
      <button class="btn" id="resetBtn">YENİ OYUN</button>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
