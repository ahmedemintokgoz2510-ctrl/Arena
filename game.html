<!DOCTYPE html>
<!-- game.html = OYUN EKRANI (tahta / bilgisayar, 16:9). Mantik: game.js, tasarim: style.css -->
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sınıf Arenası</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="board-page">
  <div class="board">
    <div class="stage" id="stage" data-phase="lobby">
      <header class="topbar">
        <div class="brand">
          <div class="title">SINIF ARENASI</div>
          <div class="info"><span class="status bad" id="status">● BAĞLANTI BEKLENİYOR</span><span class="counter" id="counter">OYUNCULAR: 0/20</span></div>
        </div>
        <div class="subject-chip hidden" id="subjectChip"></div>
        <div class="timer hidden" id="timer">15</div>
        <div class="join-panel" id="joinPanel">
          <div class="qr-box" id="qrBox" aria-label="Katılım QR kodu"></div>
          <p class="join-title">TELEFONUNLA QR KODU OKUT</p>
          <p class="join-sub">Sonra ismini girerek oyuna katıl.</p>
          <p class="join-url" id="joinUrl"></p>
        </div>
      </header>

      <!-- Soru kartı (oyun sırasında) -->
      <section class="qcard" id="qcard">
        <div class="qmeta" id="qmeta"></div>
        <div class="qtext" id="qtext"></div>
        <div class="qbar"><i id="qbar"></i></div>
      </section>

      <!-- Lobi kartı (oyun başlamadan önce): ders, oyuncular, QR, başlat -->
      <section class="lobby" id="lobby">
        <div class="lobby-main">
          <div class="lobby-subject" id="lobbySubject"></div>
          <div class="lobby-label" id="lobbyCount">OYUNCULAR 0/20</div>
          <div class="chips" id="chips"></div>
          <div class="lobby-actions">
            <button class="btn start" id="startBtn" disabled>OYUNU BAŞLAT</button>
            <button class="btn ghost" id="changeBtn">DERSİ DEĞİŞTİR</button>
          </div>
        </div>
        <div class="lobby-qr">
          <div class="qr-box" id="qrBox2" aria-label="Katılım QR kodu"></div>
          <p>Telefonunla QR kodu okut</p>
        </div>
      </section>

      <div class="arena" id="field">
        <div class="world" id="world">
          <svg class="floor" id="floor" aria-hidden="true"></svg>
          <div class="zlabel a" data-z="A"><b>A</b><span></span><em></em></div>
          <div class="zlabel b" data-z="B"><b>B</b><span></span><em></em></div>
          <div class="zlabel c" data-z="C"><b>C</b><span></span><em></em></div>
          <div class="zlabel d" data-z="D"><b>D</b><span></span><em></em></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Ders seçimi -->
  <div class="overlay hidden" id="picker">
    <div class="picker-card">
      <div class="picker-title">DERSİNİ SEÇ</div>
      <div class="subjects" id="subjects"></div>
    </div>
  </div>

  <div class="overlay hidden" id="winnerBox">
    <div class="win-card">
      <div class="win-title">🏆 KAZANAN</div>
      <div class="win-name" id="winName"></div>
      <div class="win-score" id="winScore"></div>
      <button class="btn" id="resetBtn">YENİ OYUN</button>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
