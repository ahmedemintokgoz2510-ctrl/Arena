<!DOCTYPE html>
<!-- game.html = OYUN EKRANI (tahta / bilgisayar, 16:9). Mantik: game.js, tasarim: style.css -->
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sınıf Arenası</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="board-page">
  <div class="board">
    <div class="stage">
      <header class="topbar">
        <div class="brand">
          <div class="title">SINIF ARENASI</div>
          <div class="info"><span class="status bad" id="status">● BAĞLANTI BEKLENİYOR</span><span class="counter" id="counter">OYUNCULAR: 0/20</span></div>
        </div>
        <!-- QR: dokununca buyur/kuculur; oyuncu yokken otomatik buyuk -->
        <div class="join-panel big" id="joinPanel">
          <div class="qr-box" id="qrBox" aria-label="Katılım QR kodu"></div>
          <p class="join-title">TELEFONUNLA QR KODU OKUT</p>
          <p class="join-sub">Sonra ismini girerek oyuna katıl.</p>
          <p class="join-url" id="joinUrl"></p>
        </div>
      </header>
      <section class="qcard">
        <div class="qtext" id="qtext">JOYSTICK İLE KARAKTERİNİ HAREKET ETTİR</div>
        <div class="timer hidden" id="timer">15</div>
        <button class="btn start hidden" id="startBtn">OYUNU BAŞLAT</button>
      </section>
      <div class="arena" id="field">
        <div class="world" id="world">
          <!-- A/B/C/D cevap bolgeleri (konumlar server.js ZONE_Y ile ayni) -->
          <div class="zone a"><b>A</b><span></span></div>
          <div class="zone b"><b>B</b><span></span></div>
          <div class="zone c"><b>C</b><span></span></div>
          <div class="zone d"><b>D</b><span></span></div>
        </div>
      </div>
    </div>
  </div>
  <div class="overlay hidden" id="winnerBox">
    <div class="win-card">
      <div class="win-title">🏆 KAZANAN</div>
      <div class="win-name" id="winName"></div>
      <div class="win-score" id="winScore"></div>
      <button class="btn" id="resetBtn">YENİ OYUN</button>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
